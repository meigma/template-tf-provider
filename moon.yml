language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'template-tf-provider'
  description: 'Meigma Terraform provider repository template.'
  owner: 'meigma'
  maintainers:
    - 'meigma'

# Every task runs against `system` binaries that mise (mise.toml + mise.lock) puts
# on PATH; moon manages no language toolchain itself.
toolchains:
  default: 'system'

fileGroups:
  goSources:
    # Go provider convention (as in HashiCorp's scaffolding-framework) puts the
    # main package at the repository root, so root-level *.go is a source input
    # alongside internal/.
    - '*.go'
    - 'internal/**/*.go'
    - 'go.mod'
    - 'go.sum'
    # Mock generation config. The mocks under internal/**/mocks are checked in,
    # so a change here changes compiled test code.
    - '.mockery.yml'
    # Tool/version pins. Under the `system` toolchain moon does not hash the Go
    # binary's version, so the mise pins are inputs here too — bumping Go (or any
    # tool) in mise must invalidate the cacheable build task.
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - '.goreleaser.yaml'
    - 'terraform-registry-manifest.json'
    - 'release-please-config.json'
    - '.release-please-manifest.json'
    - '.github/workflows.disabled/**/*.yml'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    command: 'golangci-lint run --config .golangci.yml ./... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build -o bin/terraform-provider-example .'
    inputs:
      - '@group(goSources)'
    outputs:
      - 'bin/terraform-provider-example'

  test:
    command: 'go test ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  # Acceptance tests: a real Terraform-compatible CLI running plan / apply /
  # destroy against the provider. They are deliberately unreachable from
  # automation (`runInCI: false`, and no `check` dependency), so the only ways
  # in are `moon run root:testacc` and the manually dispatched testacc workflow.
  #
  # `runInCI: false` bites harder than it reads: moon filters the task out
  # whenever CI is set in the environment, and it does that for an explicit
  # `moon run root:testacc` too, not only for `moon ci`. A run under CI=true
  # therefore fails with "No tasks found" rather than skipping quietly. That is
  # why the testacc workflow clears CI for its test step, and why a developer
  # who exports CI locally has to do the same.
  #
  # terraform-plugin-testing picks its CLI from TF_ACC_TERRAFORM_PATH, and it
  # never discovers OpenTofu on its own: left unset it looks for a binary named
  # `terraform` and downloads one when it finds none. A task `env` block cannot
  # shell out, so the default is resolved in the script instead — an inherited
  # TF_ACC_TERRAFORM_PATH wins, and otherwise the mise-pinned `tofu` already on
  # PATH is used.
  #
  # `-count=1` defeats Go's test cache. Without it a second run of an unchanged
  # tree reports PASS from cache without starting a CLI at all, which is the
  # wrong answer for a suite whose whole purpose is fresh evidence that the
  # provider still drives real plan / apply / destroy cycles.
  testacc:
    script: 'TF_ACC_TERRAFORM_PATH="${TF_ACC_TERRAFORM_PATH:-$(command -v tofu)}" go test ./internal/provider/ -run TestAcc -v -count=1 -timeout 30m'
    env:
      TF_ACC: '1'
    inputs:
      - '@group(goSources)'
    options:
      cache: false
      runInCI: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'docs:build'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
    options:
      cache: false
      runInCI: true
