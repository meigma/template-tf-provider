# mise: tool + environment management for template-tf-provider.
#
# mise REPLACES Proto (the former .prototools + .moon/proto/*). The committed
# mise.lock records per-platform download URLs + checksums; for aqua-backed tools
# it additionally carries cosign / SLSA / GitHub-attestation verification.
# `settings.locked` makes `mise install` FAIL CLOSED when a tool lacks a
# pre-resolved URL for the current platform.
#
# moon stays the task runner / CI gate; it is configured (.moon/toolchains.yml +
# moon.yml `toolchains.default: system`) to run these tools as `system` binaries
# that mise puts on PATH.
#
# Bump a tool: edit its version here, then
#   mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
# and commit mise.toml + mise.lock together.

[tools]
# Language runtimes (core backend).
go = "1.26.4"
python = "3.14.3"

# Go dev-tool CLIs. The explicit `aqua:` ref forces the VERIFYING backend (checksum +
# cosign/SLSA/GitHub-attestation recorded in mise.lock); it must never fall back to
# a version-only backend (asdf/npm/cargo/pipx), which records no checksum.
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:vektra/mockery"         = "3.7.2"

# tfplugindocs renders the registry-format provider documentation under docs/
# from the provider's own schema plus the examples/ tree. The generated files
# are committed and drift-checked (`moon run root:docs-check`), so this pin is
# what decides their content — bumping it will usually produce a docs diff.
"aqua:hashicorp/terraform-plugin-docs" = "0.25.0"

# Terraform-compatible CLIs used to exercise the provider end to end. The
# acceptance tests (`moon run root:testacc`) drive one of these binaries through
# real plan / apply / destroy cycles; the manually dispatched testacc workflow
# runs the suite against either or both. OpenTofu is the default.
"aqua:opentofu/opentofu"   = "1.12.5"
"aqua:hashicorp/terraform" = "1.15.8"

# Docs (MkDocs) toolchain — moved off moon's former unstable_python/unstable_uv.
"aqua:astral-sh/uv" = "0.11.0"

# Build / CI / release / supply-chain CLIs. moon itself is now mise-managed (CI
# installs it via mise instead of moonrepo/setup-toolchain). cosign backs the
# signing/verification steps in the release workflow, and goreleaser builds the
# registry-shaped release artifacts (zips, SHA256SUMS, GPG signature, SBOMs) so
# `goreleaser check` / `--snapshot` rehearsals run the same version CI does.
"aqua:moonrepo/moon"         = "2.3.5"
"aqua:sigstore/cosign"       = "3.1.1"
"aqua:goreleaser/goreleaser" = "2.17.1"
# syft is what GoReleaser shells out to for the per-zip SBOMs. Pinning it here
# rather than downloading it in the workflow keeps the release path on tools
# whose checksums mise.lock records.
"aqua:anchore/syft"          = "1.51.0"

[env]
# Pin the Go toolchain: never auto-download a toolchain other than the one above.
# The version here is authoritative and matches go.mod's `go 1.26.4`.
GOTOOLCHAIN = "local"

[settings]
# Read/write mise.lock, and fail closed if a tool lacks a pre-resolved URL for the
# current platform — replaces Proto's `checksum-url` and extends integrity
# enforcement to every tool.
lockfile = true
locked = true
