# Rehearsal for release.yml. It runs the same GoReleaser configuration, with the
# same GPG key, over a synthetic version, and asserts the full registry contract
# — then throws the artifacts away. Nothing is uploaded, published, or signed
# into a public transparency log.
#
# The point is that the first time the release path runs for real should not be
# the first time it runs at all. Two things are deliberately NOT rehearsed:
# cosign signing (it would put fake versions in Rekor forever) and the upload
# and draft-publication steps (they need a release object that does not exist).
#
# Keep the pull_request trigger broad so required check contexts still report on
# normal PRs. The job intentionally skips unless the PR head branch is a Release
# Please branch, which avoids spending runner time on routine changes.

name: Release Dry Run

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  binary-release-dry-run:
    name: Binary Release Dry Run
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Never auto-download a Go toolchain other than the mise-pinned one
      # (mise [env] is not carried by the action's shims, so set it on the job).
      GOTOOLCHAIN: local
      DRY_RUN_VERSION: 0.0.0-dryrun.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.6.14
          # Matches the real release job: publishing paths do not read caches.
          cache: false

      - name: Require GPG signing secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Release Please branches live in this repository, so secrets are
          # available here. If they are missing the rehearsal is worthless: it
          # would pass while the real release fails at the signing step.
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "GPG_PRIVATE_KEY and GPG_PASSPHRASE are not set on this repository." >&2
            echo "The release cannot sign SHA256SUMS without them, and this rehearsal" >&2
            echo "refuses to report success on a path the real release cannot take." >&2
            echo "Run scripts/gpg-provision.sh to create the signing key and secrets." >&2
            exit 1
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          printf '%s' "$GPG_PRIVATE_KEY" |
            gpg --batch --quiet --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --import

          fingerprint="$(gpg --list-secret-keys --with-colons |
            awk -F: '/^fpr:/ { print $10; exit }')"

          if [ -z "$fingerprint" ]; then
            echo "No secret key present after import; is GPG_PRIVATE_KEY the armored private key?" >&2
            exit 1
          fi

          echo "Imported signing key $fingerprint"
          echo "GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Create synthetic release tag
        run: |
          set -euo pipefail

          # Local only, never pushed. -c tag.gpgSign=false keeps a signing key in
          # the runner's keyring from turning this into a signed-tag prompt.
          git -c tag.gpgSign=false tag -f "v${DRY_RUN_VERSION}"

      - name: Build and sign release artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          GORELEASER_CURRENT_TAG="v${DRY_RUN_VERSION}" \
            goreleaser release --clean --skip=publish

      - name: Stage registry contract assets
        run: ./scripts/stage-release-assets.sh --version "$DRY_RUN_VERSION"

      - name: Check registry contract
        run: ./scripts/check-release-contract.sh --version "$DRY_RUN_VERSION" --gpg-verify

      - name: Smoke test the release binary
        run: ./scripts/smoke-test-provider.sh --version "$DRY_RUN_VERSION"

      - name: Summarize the rehearsal
        run: |
          {
            echo "## Release rehearsal passed"
            echo
            echo "Built, signed, and contract-checked \`$DRY_RUN_VERSION\`."
            echo "No artifact left this runner."
          } >> "$GITHUB_STEP_SUMMARY"
