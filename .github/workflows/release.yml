# Tag-triggered publication of the provider registry artifacts.
#
# Release Please creates the tag and a DRAFT release; this workflow fills that
# draft with the registry contract (zips, manifest, SHA256SUMS, GPG signature),
# adds a cosign bundle and GitHub-native provenance, and only then makes the
# release public. Nothing is visible to the registries until every one of those
# jobs has succeeded, because a half-populated release is one a registry may
# ingest and then refuse to re-ingest.
#
# The GPG key that signs SHA256SUMS comes from repository secrets provisioned by
# scripts/gpg-provision.sh; its public half must be registered with both
# registries before the first release.

name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

permissions: {}

jobs:
  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      version: ${{ steps.release-tag.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z-prerelease: $tag" >&2
            exit 1
          fi

          version="${tag#v}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
              exit 0
            fi
            echo "Draft release $RELEASE_TAG is not ready yet; retrying..."
            sleep 10
          done

          echo "Draft release $RELEASE_TAG was not found or is not a draft." >&2
          exit 1

  binary-release-assets:
    name: Binary Release Assets
    runs-on: ubuntu-24.04
    needs:
      - resolve-release
    permissions:
      contents: write
    env:
      # Never auto-download a Go toolchain other than the mise-pinned one
      # (mise [env] is not carried by the action's shims, so set it on the job).
      GOTOOLCHAIN: local
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out requested tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: git checkout --detach "$RELEASE_TAG"

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          # No cache in a publishing job: a restored cache is attacker-writable
          # input, and this job's output is what users install.
          cache: false

      - name: Require GPG signing secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "GPG_PRIVATE_KEY and GPG_PASSPHRASE are not set on this repository." >&2
            echo "Both registries reject a release whose SHA256SUMS is unsigned." >&2
            echo "Run scripts/gpg-provision.sh to create the signing key and secrets." >&2
            exit 1
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Loopback pinentry is what makes this work on a headless runner: gpg
          # takes the passphrase from the caller instead of opening a tty.
          printf '%s' "$GPG_PRIVATE_KEY" |
            gpg --batch --quiet --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --import

          fingerprint="$(gpg --list-secret-keys --with-colons |
            awk -F: '/^fpr:/ { print $10; exit }')"

          if [ -z "$fingerprint" ]; then
            echo "No secret key present after import; is GPG_PRIVATE_KEY the armored private key?" >&2
            exit 1
          fi

          echo "Imported signing key $fingerprint"
          echo "GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Build and sign release artifacts
        env:
          # GoReleaser reads both: the fingerprint selects the signing key and
          # the passphrase is piped to gpg's stdin by the `signs` config.
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # --skip=publish is belt and braces: .goreleaser.yaml already sets
          # release.disable, because this workflow owns every upload.
          goreleaser release --clean --skip=publish

      - name: Stage registry contract assets
        run: ./scripts/stage-release-assets.sh --version "$RELEASE_VERSION"

      - name: Check registry contract
        run: ./scripts/check-release-contract.sh --version "$RELEASE_VERSION" --gpg-verify

      - name: Smoke test the release binary
        run: ./scripts/smoke-test-provider.sh --version "$RELEASE_VERSION"

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber

      - name: Upload checksums for isolated signing and attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: dist/release-assets/terraform-provider-example_${{ needs.resolve-release.outputs.version }}_SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # Keyless cosign signature over the same SHA256SUMS the GPG signature covers.
  # It runs in its own job so the build job never holds an OIDC token: a
  # compromised build step there could otherwise mint a token that identifies as
  # this repository and sign anything it liked with it.
  sign-checksums:
    name: Sign Checksums (cosign)
    runs-on: ubuntu-24.04
    needs:
      - resolve-release
      - binary-release-assets
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: false

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: checksums

      - name: Sign checksums with cosign
        run: |
          set -euo pipefail

          sums="checksums/terraform-provider-example_${RELEASE_VERSION}_SHA256SUMS"
          cosign sign-blob --yes --bundle "${sums}.sigstore.json" "$sums"

      - name: Upload cosign bundle to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bundle="checksums/terraform-provider-example_${RELEASE_VERSION}_SHA256SUMS.sigstore.json"
          gh release upload "$RELEASE_TAG" "$bundle" --clobber

  # Generate binary provenance in an ISOLATED reusable workflow (SLSA L3): the
  # signing OIDC token is minted in attest.yml, unreachable by the build steps.
  attest-binaries:
    needs:
      - resolve-release
      - binary-release-assets
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: ./.github/workflows/attest.yml
    with:
      checksums-artifact: release-checksums
      checksums-file: terraform-provider-example_${{ needs.resolve-release.outputs.version }}_SHA256SUMS

  release-inspection-summary:
    name: Release Inspection Summary
    runs-on: ubuntu-24.04
    needs:
      - resolve-release
      - binary-release-assets
      - sign-checksums
      - attest-binaries
    permissions: {}
    steps:
      - name: Write inspection summary
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo
            echo "Every artifact is signed and attested. Commands a consumer can run:"
            echo
            echo '```sh'
            echo "gh release download $RELEASE_TAG --repo $GITHUB_REPOSITORY --dir provider"
            echo "cd provider"
            echo
            echo "# 1. The registries' own check: GPG signature over the checksum file."
            echo "gpg --verify terraform-provider-example_${RELEASE_VERSION}_SHA256SUMS.sig \\"
            echo "  terraform-provider-example_${RELEASE_VERSION}_SHA256SUMS"
            echo
            echo "# 2. Every artifact matches the checksum file."
            echo "sha256sum -c terraform-provider-example_${RELEASE_VERSION}_SHA256SUMS"
            echo
            echo "# 3. The checksum file came from this workflow."
            echo "cosign verify-blob \\"
            echo "  --bundle terraform-provider-example_${RELEASE_VERSION}_SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  terraform-provider-example_${RELEASE_VERSION}_SHA256SUMS"
            echo
            echo "# 4. GitHub-native provenance for any downloaded zip."
            echo "gh attestation verify terraform-provider-example_${RELEASE_VERSION}_linux_amd64.zip \\"
            echo "  --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/attest.yml \\"
            echo "  --source-ref refs/tags/$RELEASE_TAG --deny-self-hosted-runners"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The draft becomes public only here, after building, signing, contract
  # checking, cosign signing, and attestation have all succeeded. `needs`
  # already means "all of these passed", so reaching this job is the gate.
  publish-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs:
      - resolve-release
      - binary-release-assets
      - sign-checksums
      - attest-binaries
      - release-inspection-summary
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

          echo "Published $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
