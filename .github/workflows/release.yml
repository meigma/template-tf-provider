# This workflow is tag-triggered by Release Please. It publishes binary release
# assets with GoReleaser, attests them through GitHub-native attestations, and
# leaves draft publication as a human decision after inspection.

name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

permissions: {}

jobs:
  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      version: ${{ steps.release-tag.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z-prerelease: $tag" >&2
            exit 1
          fi

          version="${tag#v}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
              exit 0
            fi
            echo "Draft release $RELEASE_TAG is not ready yet; retrying..."
            sleep 10
          done

          echo "Draft release $RELEASE_TAG was not found or is not a draft." >&2
          exit 1

  binary-release-assets:
    name: Binary Release Assets
    runs-on: ubuntu-24.04
    needs:
      - resolve-release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out requested tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: git checkout --detach "$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser without publishing
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # With `formats: binary` GoReleaser publishes the raw build output under an
      # asset name, so every target's file is still called
      # terraform-provider-example on disk and only artifacts.json knows the
      # asset name. Copy each artifact to its asset name so the four targets do
      # not overwrite each other.
      - name: Stage release assets
        run: |
          set -euo pipefail

          mkdir -p dist/release-assets
          jq -r --arg prefix "terraform-provider-example_" '
            .[]
            | select(
                ((.type == "Binary" or .type == "SBOM") and (.name | startswith($prefix)))
                or .type == "Checksum"
              )
            | [.name, .path]
            | @tsv
          ' dist/artifacts.json | while IFS=$'\t' read -r name path; do
            cp "$path" "dist/release-assets/$name"
          done

          test -f dist/release-assets/checksums.txt
          staged="$(find dist/release-assets -maxdepth 1 -type f | wc -l)"
          if [ "$staged" -ne 9 ]; then
            echo "expected 9 release assets (4 binaries, 4 SBOMs, checksums.txt), staged $staged" >&2
            find dist/release-assets -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

      - name: Smoke test release binary
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          binary_name="terraform-provider-example"
          host_os="$(go env GOHOSTOS)"
          host_arch="$(go env GOHOSTARCH)"
          bin="dist/release-assets/${binary_name}_${version}_${host_os}_${host_arch}"

          if [ ! -x "$bin" ]; then
            echo "failed to locate executable host binary artifact $bin" >&2
            find dist/release-assets -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

          # A provider binary is a plugin. Run outside Terraform it must refuse
          # to start rather than serve gRPC on the shell's stdio.
          if output="$("$bin" 2>&1)"; then
            echo "provider binary unexpectedly succeeded when run directly" >&2
            exit 1
          fi
          printf '%s\n' "$output"

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber

      - name: Upload checksums for isolated attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: dist/release-assets/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # Generate binary provenance in an ISOLATED reusable workflow (SLSA L3): the
  # signing OIDC token is minted in attest.yml, unreachable by the build steps.
  attest-binaries:
    needs:
      - binary-release-assets
    permissions:
      id-token: write
      attestations: write
      contents: read
      # attest.yml's job declares packages: write for its registry-push path. A
      # reusable workflow cannot request more permissions than its caller grants,
      # so this caller must also grant packages even though binary attestation
      # never pushes to a registry.
      packages: write
    uses: ./.github/workflows/attest.yml
    with:
      checksums-artifact: release-checksums

  release-inspection-summary:
    name: Release Inspection Summary
    runs-on: ubuntu-24.04
    needs:
      - resolve-release
      - binary-release-assets
      - attest-binaries
    permissions: {}
    steps:
      - name: Write inspection summary
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          {
            echo "## Draft release ready for inspection"
            echo
            echo "Release: $RELEASE_TAG"
            echo
            echo "Binary verification commands:"
            echo
            echo '```sh'
            echo "gh release view $RELEASE_TAG --repo $GITHUB_REPOSITORY --json isDraft,assets"
            echo "asset=\"terraform-provider-example_${RELEASE_VERSION}_\$(go env GOOS)_\$(go env GOARCH)\""
            echo "gh release download $RELEASE_TAG --repo $GITHUB_REPOSITORY --pattern \"\${asset}\" --dir \"\$(mktemp -d)\""
            echo "gh attestation verify \"\${asset}\" --repo \"$GITHUB_REPOSITORY\" --signer-workflow \"$GITHUB_REPOSITORY/.github/workflows/attest.yml\" --source-ref \"refs/tags/$RELEASE_TAG\" --deny-self-hosted-runners"
            echo '```'
            echo
            echo "Publish or reject the draft release manually after inspection."
          } >> "$GITHUB_STEP_SUMMARY"
